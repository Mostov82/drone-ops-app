name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
        env:
          DATABASE_URL: "file:../../app-data/drone-ops.db"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
